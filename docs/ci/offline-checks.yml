name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-tree-and-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public files and manifest
        run: python tools/check_public_release.py
      - name: Run read-only CAN bridge HOST regression
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/bench/test_can_reader144.cpp -o /tmp/test_can_reader144
          /tmp/test_can_reader144
